<div class="min-h-screen flex flex-col">
  <!-- En-tête -->
  <header class="sticky top-0 z-10 bg-linear-to-r from-red-600 to-red-500 shadow-md">
    <div class="max-w-6xl mx-auto px-6 py-4 flex items-center gap-3">
      <a routerLink="/" class="flex items-center gap-3 group">
        <!-- Pokéball dessinée en CSS -->
        <div
          class="relative w-9 h-9 rounded-full border-4 border-gray-900 overflow-hidden bg-white group-hover:rotate-12 transition"
        >
          <div class="absolute inset-x-0 top-0 h-1/2 bg-red-600 border-b-4 border-gray-900"></div>
          <div
            class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-3 h-3 rounded-full bg-white border-2 border-gray-900"
          ></div>
        </div>
        <h1 class="text-2xl font-extrabold text-white tracking-wide">{{ title() }}</h1>
      </a>
    </div>
  </header>

  <!-- Contenu de la page (liste ou détail) -->
  <main class="flex-1">
    <router-outlet />
  </main>

  <!-- Pied de page -->
  <footer class="py-6 text-center text-sm text-gray-400">
    Données fournies par
    <a href="https://pokeapi.co" target="_blank" class="underline hover:text-gray-600">PokeAPI</a>
  </footer>
</div>
