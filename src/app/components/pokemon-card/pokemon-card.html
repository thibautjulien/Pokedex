<article
  class="bg-white rounded-xl shadow hover:shadow-lg hover:-translate-y-1 transition p-4 flex flex-col items-center"
>
  <img [src]="pokemon().image" [alt]="pokemon().name" class="w-24 h-24" />
  <span class="text-sm text-gray-400">#{{ pokemon().id }}</span>
  <h2 class="font-semibold capitalize">{{ pokemon().name }}</h2>
</article>
