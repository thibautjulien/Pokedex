<section class="max-w-6xl mx-auto p-6">
  <div class="flex items-center justify-center gap-4 mb-6">
    <button
      class="px-4 py-2 rounded-lg bg-red-500 text-white font-semibold hover:bg-red-600 disabled:opacity-40 disabled:cursor-not-allowed"
      (click)="precedent()"
      [disabled]="page() === 1"
    >
      Précédent
    </button>
    <span> Page {{ page() }} </span>
    <button
      class="px-4 py-2 rounded-lg bg-red-500 text-white font-semibold hover:bg-red-600 disabled:opacity-40 disabled:cursor-not-allowed"
      (click)="suivant()"
    >
      Suivant
    </button>
  </div>
  <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
    @for (p of pokemons(); track p.id) {
      <app-pokemon-card [pokemon]="p" />
    }
  </div>
</section>
